name: Backend CI/CD

on:
  push:
    branches:
      - despliegue

jobs:
  test-build-and-deploy:
    name: Test, build and deploy backend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Grant execute permission for Gradle wrapper
        run: chmod +x ./gradlew

      - name: Run backend tests
        run: ./gradlew clean test --no-daemon

      - name: Build backend jar
        run: ./gradlew bootJar --no-daemon

      - name: Resolve jar file
        id: jar
        shell: bash
        run: |
          JAR_FILE=$(find build/libs -type f -name "*.jar" ! -name "*plain.jar" | head -n 1)
          if [ -z "$JAR_FILE" ]; then
            echo "No deployable jar found in build/libs"
            exit 1
          fi
          echo "file=$JAR_FILE" >> "$GITHUB_OUTPUT"
          echo "Found jar: $JAR_FILE"

      - name: Configure AWS credentials
        if: github.event_name == 'push'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Upload jar to S3
        if: github.event_name == 'push'
        id: upload
        shell: bash
        run: |
          VERSION_LABEL="backend-${GITHUB_SHA::7}-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          S3_KEY="elasticbeanstalk/backend/${VERSION_LABEL}.jar"

          aws s3 cp "${{ steps.jar.outputs.file }}" "s3://${{ secrets.EB_DEPLOY_BUCKET }}/${S3_KEY}"

          echo "version_label=${VERSION_LABEL}" >> "$GITHUB_OUTPUT"
          echo "s3_key=${S3_KEY}" >> "$GITHUB_OUTPUT"

      - name: Create Elastic Beanstalk application version
        if: github.event_name == 'push'
        run: |
          aws elasticbeanstalk create-application-version \
            --application-name "${{ secrets.EB_APPLICATION_NAME }}" \
            --version-label "${{ steps.upload.outputs.version_label }}" \
            --source-bundle S3Bucket="${{ secrets.EB_DEPLOY_BUCKET }}",S3Key="${{ steps.upload.outputs.s3_key }}"

      - name: Deploy application version to Elastic Beanstalk
        if: github.event_name == 'push'
        run: |
          aws elasticbeanstalk update-environment \
            --environment-name "${{ secrets.EB_ENVIRONMENT_NAME }}" \
            --version-label "${{ steps.upload.outputs.version_label }}"

      - name: Wait for Elastic Beanstalk deployment
        if: github.event_name == 'push'
        run: |
          aws elasticbeanstalk wait environment-updated \
            --environment-names "${{ secrets.EB_ENVIRONMENT_NAME }}"

      - name: Show Elastic Beanstalk environment status
        if: always() && github.event_name == 'push'
        run: |
          aws elasticbeanstalk describe-environments \
            --environment-names "${{ secrets.EB_ENVIRONMENT_NAME }}" \
            --query "Environments[0].{Status:Status,Health:Health,VersionLabel:VersionLabel,CNAME:CNAME}" \
            --output table